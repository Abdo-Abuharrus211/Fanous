apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fanous
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: fanous-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fanous-secrets
                  key: HF_TOKEN
                  optional: true
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              memory: "4Gi"
              cpu: "500m"
            limits:
              memory: "5Gi"
              cpu: "1"
