apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fanous
  namespace: fanous
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: fanous.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
